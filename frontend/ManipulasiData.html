<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulasi Data Pelanggan</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <header class="site-header">
        <h1>Manipulasi Data Pelanggan</h1>
        <p>Tambah, cari, edit, dan hapus data pelanggan</p>
    </header>
    <nav class="navbar"><a href="index.html">Home</a><a class="active" href="ManipulasiData.html">Manipulasi Data</a>
    </nav>
    <main class="manage-content">
        <section class="panel">
            <h2 id="formTitle">Tambah Pelanggan</h2>
            <form id="customerForm">
                <input type="hidden" id="customerId">
                <div class="form-grid">
                    <div><label for="nama">Nama Pelanggan</label><input id="nama" name="nama" type="text"
                            maxlength="100" required></div>
                    <div><label for="telepon">Nomor Telepon</label><input id="telepon" name="telepon" type="tel"
                            maxlength="20" required></div>
                    <div><label for="email">Email</label><input id="email" name="email" type="email" maxlength="100"
                            required></div>
                    <div><label for="alamat">Alamat</label><textarea id="alamat" name="alamat" rows="3"
                            required></textarea></div>
                </div>
                <div class="actions"><button type="submit" id="saveButton">Tambahkan</button><button type="button"
                        class="secondary" id="cancelEdit" hidden>Batal Edit</button></div>
                <p id="formMessage" class="message" role="status"></p>
            </form>
        </section>
        <section class="panel">
            <h2>Daftar Pelanggan</h2>
            <form id="manageSearchForm" class="search-form"><label for="manageSearch">Cari nama atau email</label><input
                    type="search" id="manageSearch" placeholder="Masukkan nama atau email..."><button
                    type="submit">Cari</button><button type="button" class="secondary"
                    id="resetManageSearch">Reset</button></form>
            <p id="manageMessage" class="message" role="status"></p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nama</th>
                            <th>Telepon</th>
                            <th>Email</th>
                            <th>Alamat</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="manageCustomerRows">
                        <tr>
                            <td colspan="6">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <p><a href="index.html">← Kembali ke Home</a></p>
    </main>
    <footer class="footer">
        <p>&copy; 2026 Website Perusahaan</p>
    </footer>
</body>

</html>
